<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen Wallet</title>
<meta name="theme-color" content="#7c5cff">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c5cff'/%3E%3Crect x='13' y='24' width='38' height='22' rx='8' fill='%23fff'/%3E%3Ccircle cx='44' cy='35' r='5' fill='%23ffc857'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#eef3f2;--card:#fff;--tx:#10201f;--mu:#667775;--ac:#0f766e;--hero:#0b3c43;--gold:#ffc857;--ok:#128a56;--bad:#d6404a;--bd:#d9e3e1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1315;--card:#12201f;--tx:#e8f2f0;--mu:#8aa09d;--ac:#2dd4bf;--hero:#0e3a40;--bd:#223533;--ok:#3ddc97;--bad:#ff6b73;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1315;--card:#12201f;--tx:#e8f2f0;--mu:#8aa09d;--ac:#2dd4bf;--hero:#0e3a40;--bd:#223533;--ok:#3ddc97;--bad:#ff6b73;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,.num{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif}
#app{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:16px 16px 24px}
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:24px 18px 18px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-50px;top:-50px;width:150px;height:150px;border:22px solid var(--gold);border-radius:50%;opacity:.9}
.hero h1{font-size:40px;margin:4px 0 20px;letter-spacing:-.02em}
.acts{display:flex;gap:8px;position:relative;z-index:1}
.acts button{flex:1;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:14px;padding:10px 2px;font:inherit;font-size:12px;cursor:pointer}
.acts b{display:block;font-size:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-top:12px}
.it{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}.it:last-child{border:0;padding-bottom:0}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.g{flex:1;min-width:0}.r{text-align:right}
.mu{color:var(--mu);font-size:12px}.up{color:var(--ok)}.dn{color:var(--bad)}
label{display:block;font-size:12px;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.btn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer}
:root:not([data-theme="light"]) .btn{color:#06201d}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}.hd h2{margin:0;font-size:22px}
.bk{border:0;background:var(--card);color:var(--tx);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}
nav{display:flex;border-top:1px solid var(--bd);background:var(--card)}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;padding:8px 4px;cursor:pointer}
nav button.on{color:var(--ac);font-weight:700}nav b{display:block;font-size:18px}
.chip{display:inline-block;padding:6px 12px;border-radius:99px;border:1px solid var(--bd);margin:8px 6px 0 0;font-size:12px;cursor:pointer;background:var(--bg)}
.warn{background:rgba(255,200,87,.2);border-radius:10px;padding:10px;font-size:12px;margin-top:12px}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.ph span{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;font-size:13px}
.ctr{text-align:center}
.row2{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pl 1.4s infinite}@keyframes pl{50%{opacity:.25}}
.orb{position:relative;border-radius:50%;margin:0 auto;overflow:hidden;cursor:pointer;background:#0b3c43;box-shadow:0 12px 32px rgba(11,60,67,.45),inset 0 -8px 16px rgba(0,0,0,.35);transition:transform .25s ease}
.orb:active,.orb.t{transform:scale(1.12)}
.orb:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.55),transparent 45%)}
.orb i{position:absolute;width:70%;height:70%;filter:blur(8px);mix-blend-mode:screen;animation:mo 7s ease-in-out infinite}
.orb i:nth-child(1){background:#2dd4bf;left:-10%;top:-5%}
.orb i:nth-child(2){background:#ffc857;right:-12%;top:20%;animation-delay:-2s;animation-duration:9s}
.orb i:nth-child(3){background:#ff6b8a;left:15%;bottom:-15%;animation-delay:-4s;animation-duration:8s}
.orb.t i{animation-duration:1.1s}
:root[data-theme="dark"]{--bg:#000;--card:#141414;--tx:#fff;--mu:#9b9b9b;--ac:#4fe3c1;--bd:#262626;--ok:#3ddc84;--bad:#ff4d5e}
</style></head>
<body><div id="app"></div><div id="toast"></div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(err => console.log('SW registration failed:', err));
  });
}
</script>
<script>
const C={BTC:{n:'Bitcoin',p:67000,fee:.0001,c:'#f7931a',net:'Bitcoin'},ETH:{n:'Ethereum',p:3300,fee:.002,c:'#627eea',net:'Ethereum'},SOL:{n:'Solana',p:165,fee:.00025,c:'#10a37f',net:'Solana'},BNB:{n:'BNB',p:600,fee:.0005,c:'#f3ba2f',net:'BNB Chain'},USDT:{n:'Tether',p:1,fee:0.0001,c:'#26a17b',net:'Ethereum'}};
const WORDS='able acid arch atom axis bean bird blue bolt cake calm cave chef city clay cloud coin cove crab dawn deer dove dust echo edge fern fire fish flag fox frog gem glow gold hawk iron jade jazz jet join joy kiss lake leaf light lion lode lotus mango meadow moon moss nest oak olive orbit palm pearl pine prism pulse quartz reef river rock rose ruby scout shore solar spark stone storm swing tide trail tree unity valley vapor wave willow wisdom wolf wood zen';
const HEX='0123456789abcdef',B32='qpzry9x8gf2tvdw0s3jn54khce6mua7l',B58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
const V={BTC:a=>/^(bc1[a-z0-9]{25,60}|[13][a-km-zA-HJ-NP-Z1-9]{25,34})$/.test(a),ETH:a=>/^0x[0-9a-fA-F]{40}$/.test(a),SOL:a=>/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a)};V.BNB=V.USDT=V.ETH;
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rs=(cs,n)=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return[...a].map(x=>cs[x%cs.length]).join('')};
const mk=()=>{const e='0x'+rs(HEX,40);return{BTC:'bc1q'+rs(B32,38),ETH:e,BNB:e,USDT:e,SOL:rs(B58,44)}};
const usd=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const amt=(n,s)=>(+n.toFixed(s==='USDT'?2:6)).toString();
const sh=a=>a.slice(0,6)+'…'+a.slice(-4);
const K='lumen_wallet_v1';let mem=null,S,v,F={},tmp={},tt;
const load=()=>{try{const x=localStorage.getItem(K);return x?JSON.parse(x):null}catch(e){return mem}};
async function save(){if(!KEY)return;try{const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,enc.encode(JSON.stringify(S)));A[EM].iv=b64(iv);A[EM].ct=b64(new Uint8Array(ct));localStorage.setItem('lumen_accts_v2',JSON.stringify(A))}catch(e){}}
const P={},D={};Object.keys(C).forEach(k=>{P[k]=C[k].p;D[k]=(Math.random()-.4)*6});
const tot=()=>Object.keys(C).reduce((t,k)=>t+S.bal[k]*P[k],0);
const add=o=>{o.ts=Date.now();o.h=o.h||'0x'+rs(HEX,64);S.tx.unshift(o);return o};
const cc=d=>F.c||d||'ETH';
function toast(m){const t=$('toast');t.textContent=m;t.className='on';clearTimeout(tt);tt=setTimeout(()=>t.className='',2200)}
function go(x,f){v=x;F=f||{};R()}
const hd=(t,b)=>`<div class=hd><button class=bk aria-label=Back onclick="go('${b||'home'}')">‹</button><h2>${t}</h2></div>`;
const sel=(k,def)=>`<select onchange="F.${k}=this.value;R()">${Object.keys(C).map(x=>`<option value=${x} ${(F[k]||def)===x?'selected':''}>${C[x].n} (${x})</option>`).join('')}</select>`;
const ic=k=>`<div class=ic style="background:${C[k].c}">${k[0]}</div>`;
const orb=n=>`<div class=lgo role=img aria-label="Lumen logo" style="width:${n}px;height:${n}px" onclick="this.classList.add('t');setTimeout(()=>this.classList.remove('t'),700)"><svg viewBox='0 0 64 64' aria-hidden='true'><g><rect x='10' y='20' width='44' height='26' rx='10' fill='#fff' opacity='.18'/><path d='M18 24h28l-6 16H24z' fill='#fff' opacity='.9'/><path d='M24 16h16l8 8H16z' fill='#fff' opacity='.8'/><circle cx='32' cy='33' r='5' fill='#ffc857'/></g></svg></div>`;
const VW={
  onb0:()=>`<div class=ctr style="padding-top:56px">${orb(124)}<h1 style="margin:20px 0 6px;font-size:34px">Lumen Wallet</h1><p class=mu>Your crypto in one secure place.</p><div class=card style="padding:0"><button class="btn" onclick="go('su')">Create account</button></div></div>`,
  su:()=>hd('Create account','onb0')+`<div class=card><label>Full name</label><input autocomplete=name value="${esc(F.nm||'')}" oninput="F.nm=this.value"><label>Email</label><input type=email autocomplete=email value="${esc(F.em||'')}" oninput="F.em=this.value"><label>Password</label><input type=password value="${esc(F.p1||'')}" oninput="F.p1=this.value"><label>Confirm password</label><input type=password value="${esc(F.p2||'')}" oninput="F.p2=this.value"><label>4-digit PIN</label><input type=password inputmode=numeric maxlength=4 value="${esc(F.pn||'')}" oninput="F.pn=this.value"><button class="btn" onclick="sup()">Continue</button></div>`,
  onb2:()=>hd('Recovery phrase','su')+`<p class=mu>Write these 12 words down in order. They are the only way to restore your wallet.</p><div class=ph>${tmp.ph.map((w,i)=>`<span>${i+1}. ${w}</span>`).join('')}</div><button class="btn" onclick="fin()">Finish setup</button>`,
  home:()=>`<div class=hero><div style="opacity:.75;font-size:13px">Total balance for ${esc(S.name||'you')}</div><h1>${usd(tot())}</h1><div class=acts><button onclick="go('send')"><b>↑</b>Send</button><button onclick="go('recv')"><b>↓</b>Receive</button></div></div><div class=card><b>Assets</b>${Object.keys(C).map(k=>`<div class=it style="cursor:pointer" onclick="go('coin',{k:'${k}'})">${ic(k)}<div class=g><b>${C[k].n}</b><div class=mu>${usd(P[k])}</div></div><div class=r><b>${amt(S.bal[k],k)} ${k}</b></div></div>`).join('')}</div><button class="btn s" onclick="faucet()">Add demo funds</button>`,
  send:()=>{const c=cc(),m=C[c],a=+F.a;return hd('Send')+`<div class=card><label>Asset</label>${sel('c','ETH')}<div class=mu style="margin-top:4px">Available: ${amt(S.bal[c],c)} ${c}</div><label>Recipient address (${m.net})</label><input value="${esc(F.to||'')}" oninput="F.to=this.value"><label>Amount</label><input type=number value="${esc(F.a||'')}" oninput="F.a=this.value"><button class="btn" onclick="rev()">Review payment</button></div>`},
  recv:()=>{const c=cc();return hd('Receive')+`<div class=card><label>Asset</label>${sel('c','ETH')}<div class=mu style="margin-top:12px">Address</div><div style="margin-top:8px;background:#fff;padding:12px;border-radius:12px;word-break:break-all">${S.addr[c]}</div><button class="btn" onclick="navigator.clipboard.writeText('${S.addr[c]}');toast('Address copied')">Copy address</button></div>`},
  coin:()=>{const k=F.k;return hd(C[k].n,'home')+`<div class=card><div style="display:flex;justify-content:space-between;align-items:center"><span class=mu>${k}</span><button class=bk onclick="go('home')">↻</button></div><div class=big>${amt(S.bal[k],k)}</div><div class=cr>${k}</div><div class=card><div class=row2><span class=mu>Price</span><span>${usd(P[k])}</span></div><div class=row2><span class=mu>Balance</span><span>${usd(S.bal[k]*P[k])}</span></div></div></div>`},
  set:()=>hd('Settings')+`<div class=card><b>Security</b><div class=warn>Demo mode: balances and transactions are simulated.</div></div>`
};
function sup(){const e=(F.em||'').trim().toLowerCase();if(!(F.nm||'').trim())return toast('Enter your name');if(!/^\S+@\S+\.\S+$/.test(e))return toast('Enter a valid email');if((F.p1||'').length<8)return toast('Password needs 8 or more characters');if(F.p1!==F.p2)return toast('Passwords do not match');if(!/^\d{4}$/.test(F.pn||''))return toast('PIN must be 4 digits');tmp={nm:F.nm.trim(),em:e,pw:F.p1,pin:F.pn,ph:Array.from({length:12},()=>WORDS[crypto.getRandomValues(new Uint8Array(1))[0]%WORDS.length])};go('onb2')}
async function fin(){S={name:tmp.nm,pin:tmp.pin,phrase:tmp.ph,bal:{BTC:0,ETH:0,SOL:0,BNB:0,USDT:0},addr:mk(),tx:[],book:[]};save();go('home')}
function rev(){const c=cc(),a=+F.a,t=(F.to||'').trim();if(!V[c](t))return toast('That is not a valid '+C[c].net+' address');if(!(a>0))return toast('Enter an amount');if(a+C[c].fee>S.bal[c]+1e-12)return toast('Not enough balance for amount plus fee');F.s=1;F.c=c;go('send')}
function faucet(){const g={BTC:.05,ETH:1,SOL:10,BNB:2,USDT:500};Object.keys(g).forEach(k=>{S.bal[k]+=g[k];add({ti:'Demo funds',sub:'Test faucet',d:'+'+g[k]+' '+k,up:1,st:'Completed'})});save();R()}
function R(){const a=$('app');a.innerHTML=`<main>${VW[v] ? VW[v]() : VW.home()}</main>`}
let KEY={};let A={};
const ks=Object.keys(A);v='onb0';F={};R();
</script></body></html>
