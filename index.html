</style></head>
<body><div id="app"></div><div id="toast"></div>
<script>
const C={BTC:{n:'Bitcoin',p:67000,fee:.0001,c:'#f7931a',net:'Bitcoin'},ETH:{n:'Ethereum',p:3300,fee:.002,c:'#627eea',net:'Ethereum'},SOL:{n:'Solana',p:165,fee:.00025,c:'#10a37f',net:'Solana'},BNB:{n:'BNB',p:590,fee:.0005,c:'#d9a50b',net:'BNB Chain'},USDT:{n:'Tether',p:1,fee:1,c:'#26a17b',net:'Ethereum (ERC-20)'}};
const WORDS='able acid arch atom axis bean bird blue bolt cake calm cave chef city clay cloud coin cove crab dawn deer dove dust echo edge fern fire fish flag fox frog gem glow gold hawk iron jade kite lake lamp leaf lime lion moon moss nest oak opal palm pearl pine rain reef rose sand seed silk snow star tide tree wave wind wolf zinc'.split(' ');
const HEX='0123456789abcdef',B32='qpzry9x8gf2tvdw0s3jn54khce6mua7l',B58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
const V={BTC:a=>/^(bc1[a-z0-9]{25,60}|[13][a-km-zA-HJ-NP-Z1-9]{25,34})$/.test(a),ETH:a=>/^0x[0-9a-fA-F]{40}$/.test(a),SOL:a=>/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a)};V.BNB=V.USDT=V.ETH;
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rs=(cs,n)=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return[...a].map(x=>cs[x%cs.length]).join('')};
const mk=()=>{const e='0x'+rs(HEX,40);return{BTC:'bc1q'+rs(B32,38),ETH:e,BNB:e,USDT:e,SOL:rs(B58,44)}};
const usd=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const amt=(n,s)=>(+n.toFixed(s==='USDT'?2:6)).toString();
const sh=a=>a.slice(0,6)+'…'+a.slice(-4);
const K='lumen_wallet_v1';let mem=null,S,v,F={},tmp={},tt;
const load=()=>{try{const x=localStorage.getItem(K);return x?JSON.parse(x):null}catch(e){return mem}};
async function save(){if(!KEY)return;try{const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,enc.encode(JSON.stringify(S)));A[EM].iv=b64(iv);A[EM].ct=b64(ct);localStorage.setItem('lumen_accts_v2',JSON.stringify(A))}catch(e){}}
const P={},D={};Object.keys(C).forEach(k=>{P[k]=C[k].p;D[k]=(Math.random()-.4)*6});
const tot=()=>Object.keys(C).reduce((t,k)=>t+S.bal[k]*P[k],0);
const add=o=>{o.ts=Date.now();o.h=o.h||'0x'+rs(HEX,64);S.tx.unshift(o);return o};
const cc=d=>F.c||d||'ETH';
function toast(m){const t=$('toast');t.textContent=m;t.className='on';clearTimeout(tt);tt=setTimeout(()=>t.className='',2200)}
function go(x,f){v=x;F=f||{};R()}
const hd=(t,b)=>`<div class=hd><button class=bk aria-label=Back onclick="go('${b||'home'}')">‹</button><h2>${t}</h2></div>`;
const sel=(k,def,fn)=>`<select onchange="F.${k}=this.value;R()">${Object.keys(C).map(x=>`<option value=${x} ${(F[k]||def)===x?'selected':''}>${C[x].n} (${x})</option>`).join('')}</select>`;
const ic=k=>`<div class=ic style="background:${C[k].c}">${k[0]}</div>`;
const pinIn=`<label>Your PIN</label><input type=password inputmode=numeric maxlength=4 autocomplete=off placeholder="4 digits" oninput="F.pin=this.value">`;
const T=['home','mkt','swap','act','set'];
const orb=n=>`<div class=lgo role=img aria-label="Lumen logo" style="width:${n}px;height:${n}px" onclick="this.classList.add('t');setTimeout(()=>this.classList.remove('t'),700)"><svg viewBox='0 0 64 64' width='100%' height='100%'><defs><linearGradient id='lgb' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#b9a6ff'/><stop offset='1' stop-color='#3a2a8a'/></linearGradient></defs><rect width='64' height='64' rx='16' fill='url(#lgb)'/><path d='M15 26c0-2.5 1.6-4.6 4-5.3l22-6.7c2-.6 4 .9 4 3v9H15z' fill='#fff' opacity='.55'/><rect x='13' y='24' width='38' height='26' rx='7' fill='#fff'/><rect x='37' y='32' width='17' height='11' rx='5.5' fill='#ffc857'/><circle cx='43' cy='37.5' r='2.2' fill='#3a2a8a'/><path class='sp' d='M50 6l1.6 4.8L56.5 12.5l-4.9 1.7L50 19l-1.6-4.8-4.9-1.7 4.9-1.7z' fill='#ffc857'/></svg></div>`;
const nav=()=>`<nav>${[['home','◉','Home'],['mkt','▲','Market'],['swap','⇄','Swap'],['act','☰','Activity'],['set','⚙','Settings']].map(t=>`<button class="${v===t[0]?'on':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('')}</nav>`;

const VW={
onb0:()=>`<div class=ctr style="padding-top:56px"><div class=ic style="background:var(--hero);width:88px;height:88px;margin:auto;font-size:40px;border:8px solid var(--gold)" class=num>L</div><h1 style="margin:20px 0 6px;font-size:34px">Lumen Wallet</h1><p class=mu style="font-size:14px">Send, receive, swap and withdraw crypto from one place.</p><button class=btn onclick="tmp={};go('onb1')">Create a new wallet</button><button class="btn s" onclick="go('imp')">I already have a wallet</button></div>`,
imp:()=>hd('Import wallet','onb0')+`<div class=card><label>Enter your 12-word recovery phrase</label><textarea rows=4 oninput="F.ph=this.value" placeholder="word1 word2 word3 …"></textarea></div><button class=btn onclick="imp()">Continue</button>`,
onb1:()=>hd('Set a PIN','onb0')+`<div class=card><p class=mu>The PIN unlocks the wallet and confirms every payment.</p><label>Choose a 4-digit PIN</label><input type=password inputmode=numeric maxlength=4 oninput="F.p1=this.value"><label>Repeat PIN</label><input type=password inputmode=numeric maxlength=4 oninput="F.p2=this.value"></div><button class=btn onclick="pin1()">Continue</button>`,
onb2:()=>hd('Recovery phrase','onb1')+`<p class=mu>Write these 12 words down in order. They are the only way to restore your wallet.</p><div class=ph>${tmp.ph.map((w,i)=>`<span>${i+1}. ${w}</span>`).join('')}</div><label style="display:flex;gap:8px;align-items:center;color:var(--tx);font-size:13px"><input type=checkbox style="width:auto" onchange="F.ck=this.checked">I saved my recovery phrase somewhere safe</label><button class=btn onclick="F.ck?fin():toast('Confirm that you saved the phrase')">Open my wallet</button>`,
lock:()=>`<div class=ctr style="padding-top:80px"><div class=ic style="background:var(--hero);width:64px;height:64px;margin:auto;font-size:26px;border:5px solid var(--gold)">L</div><h2 style="font-size:26px">Welcome back</h2><p class=mu>Enter your PIN to unlock</p><input type=password inputmode=numeric maxlength=4 autofocus style="max-width:180px;text-align:center;font-size:22px;letter-spacing:.4em" oninput="F.l=this.value;if(this.value.length==4)unlock(this)"></div>`,
home:()=>`<div class=hero><div style="opacity:.75;font-size:13px">Total balance for ${esc(S.name||'you')}</div><h1>${usd(tot())}</h1><div class=acts><button onclick="go('send')"><b>↑</b>Send</button><button onclick="go('recv')"><b>↓</b>Receive</button><button onclick="go('swap')"><b>⇄</b>Swap</button><button onclick="go('wd')"><b>⇩</b>Withdraw</button></div></div>
<div class=warn>Demo mode: balances, prices and transactions are simulated. No real crypto moves.</div>
<div class=card><b>Assets</b>${Object.keys(C).map(k=>`<div class=it style="cursor:pointer" onclick="go('coin',{k:'${k}'})">${ic(k)}<div class=g><b>${C[k].n}</b><div class=mu>${usd(P[k])} <span class="${D[k]<0?'dn':'up'}">${D[k]>0?'+':''}${D[k].toFixed(2)}%</span></div></div><div class=r><b>${amt(S.bal[k],k)} ${k}</b><div class=mu>${usd(S.bal[k]*P[k])}</div></div></div>`).join('')}</div>
<button class="btn s" onclick="faucet()">Add demo funds</button>`,
send:()=>{const c=cc(),s=F.s|0,m=C[c],a=+F.a;
if(s===2)return `<div class=ctr style="padding-top:40px"><div class=ic style="background:var(--ok);width:64px;height:64px;margin:auto;font-size:28px">✓</div><h2>Sent</h2><p>${amt(a,c)} ${c} is on its way to<br><span class=mu style="word-break:break-all">${esc(F.to.trim())}</span></p><p class=mu>Transaction hash ${F.h.slice(0,18)}…</p><button class=btn onclick="go('home')">Done</button></div>`;
if(s===1)return `<div class=hd><button class=bk onclick="F.s=0;R()">‹</button><h2>Review payment</h2></div><div class=card><div class=row2><span class=mu>To</span><span style="word-break:break-all;text-align:right;max-width:70%">${esc(sh(F.to.trim()))}</span></div><div class=row2><span class=mu>Network</span><span>${m.net}</span></div><div class=row2><span class=mu>Amount</span><b>${amt(a,c)} ${c}</b></div><div class=row2><span class=mu>Network fee</span><span>${m.fee} ${c}</span></div><div class=row2><span class=mu>Total</span><b>${amt(a+m.fee,c)} ${c}</b></div><div class=row2><span class=mu>Value</span><span>${usd(a*P[c])}</span></div>${pinIn}</div><button class=btn onclick="cs()">Confirm and send</button>`;
return hd('Send')+`<div class=card><label>Asset</label>${sel('c','ETH')}<div class=mu style="margin-top:4px">Available: ${amt(S.bal[c],c)} ${c}</div><label>Recipient address (${m.net})</label><input placeholder="${c==='BTC'?'bc1…':c==='SOL'?'Solana address':'0x…'}" value="${esc(F.to||'')}" oninput="F.to=this.value" autocomplete=off>${S.book.map(x=>`<span class=chip onclick="F.to='${x.addr}';R()">${esc(x.name)}</span>`).join('')}<label>Amount</label><input type=number inputmode=decimal min=0 placeholder="0.0" value="${F.a||''}" oninput="F.a=this.value"><span class=chip onclick="mx()">Use max</span><div class=mu style="margin-top:8px">Network fee: ${m.fee} ${c}</div></div><button class=btn onclick="rev()">Review payment</button>`},
recv:()=>{const c=cc();return hd('Receive')+`<div class="card ctr"><div style="text-align:left">${sel('c','ETH')}</div><div id=qr style="background:#fff;display:inline-block;padding:12px;border-radius:12px;margin:16px 0"></div><div class=mu>Your ${c} address</div><p style="word-break:break-all;font-size:13px">${S.addr[c]}</p><button class="btn s" onclick="cp()">Copy address</button></div><div class=warn>Only send ${c} on the ${C[c].net} network to this address. Other assets can be lost.</div>`},
swap:()=>`<div class=hd><h2>Swap</h2></div><div class=card><label>From</label>${sel('f','ETH')}<label>Amount (balance ${amt(S.bal[F.f||'ETH'],F.f||'ETH')} ${F.f||'ETH'})</label><input type=number inputmode=decimal min=0 placeholder="0.0" value="${F.a||''}" oninput="F.a=this.value;$('so').textContent=swt()"><label>To</label>${sel('t','USDT')}<div class=warn id=so>${swt()}</div></div><button class=btn onclick="doSwap()">Swap</button>`,
wd:()=>{const c=cc('USDT');return hd('Withdraw')+`<div class=card><label>Asset</label>${sel('c','USDT')}<div class=mu style="margin-top:4px">Available: ${amt(S.bal[c],c)} ${c}</div><label>Amount</label><input type=number inputmode=decimal min=0 placeholder="0.0" value="${F.a||''}" oninput="F.a=this.value;$('wo').textContent=wt()"><label>Withdraw to</label><select onchange="F.m=this.value"><option>Bank transfer</option><option ${F.m==='Mobile money'?'selected':''}>Mobile money</option><option ${F.m==='Debit card'?'selected':''}>Debit card</option></select><label>Account or phone number</label><input value="${esc(F.ac||'')}" oninput="F.ac=this.value" autocomplete=off><div class=warn id=wo>${wt()}</div>${pinIn}</div><button class=btn onclick="doWd()">Withdraw</button>`},
act:()=>`<div class=hd><h2>Activity</h2></div><div class=card>${S.tx.length?S.tx.map(x=>`<div class=it><div class=ic style="background:${x.up?'var(--ok)':'var(--ac)'}">${x.up?'↓':'↑'}</div><div class=g><b>${esc(x.ti)}</b><div class=mu>${esc(x.sub)}, ${new Date(x.ts).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div><div class=r><b class="${x.up?'up':''}">${esc(x.d)}</b><div class=mu>${x.st}</div></div></div>`).join(''):'<p class=mu>No transactions yet. Add demo funds on the Home tab to try a payment.</p>'}</div>`,
set:()=>`<div class=hd><h2>Settings</h2></div><div class=card><b>Address book</b>${S.book.map((x,i)=>`<div class=it><div class=g><b>${esc(x.name)}</b><div class=mu>${sh(x.addr)}</div></div><button class=bk onclick="delB(${i})" aria-label=Remove>✕</button></div>`).join('')}<label>Name</label><input id=bn><label>Wallet address</label><input id=ba autocomplete=off><button class="btn s" onclick="addB()">Save contact</button></div>
<div class=card><b>Security</b>${F.rv?`<div class=ph>${S.phrase.map((w,i)=>`<span>${i+1}. ${w}</span>`).join('')}</div><div class=warn>Never share these words. Anyone who has them controls your wallet.</div>`:`<label>Enter your PIN to show the recovery phrase</label><input type=password inputmode=numeric maxlength=4 oninput="F.rp=this.value;if(this.value.length==4)rv(this)">`}<button class="btn s" onclick="lock()">Lock wallet</button><button class="btn s" style="color:var(--bad)" onclick="reset()">${F.rs?'Tap again to erase this wallet':'Erase wallet'}</button></div><p class="mu ctr">Lumen Wallet demo build</p>`
};
function R(k){const o=document.querySelector('main'),y=k&&o?o.scrollTop:0,m=MT.includes(v);$('app').innerHTML=(m?topbar():'')+`<main>${SUB.includes(v)?`<div style="margin-bottom:6px"><button class=bk aria-label=Back onclick="go('home')">‹</button></div>`:''}${VW[v]()}</main>`+(m?bar():'')+(dw?drawer():'')+(fm?fab():'');const n=document.querySelector('main');if(k&&n)n.scrollTop=y;if(v==='recv')qr()}
function qr(){const el=$('qr');if(!el)return;try{new QRCode(el,{text:S.addr[cc()],width:160,height:160})}catch(e){el.textContent='QR unavailable'}}
function cp(){try{navigator.clipboard.writeText(S.addr[cc()]).then(()=>toast('Address copied'),()=>toast('Select the address to copy'))}catch(e){toast('Select the address to copy')}}
function swt(){const f=F.f||'ETH',t=F.t||'USDT',a=+F.a||0;return 'You receive about '+amt(a*P[f]/P[t]*.995,t)+' '+t+' (0.5% fee)'}
function wt(){const c=cc('USDT');return 'You receive about '+usd((+F.a||0)*P[c]*.99)+' after a 1% fee. Minimum $10.'}
function mx(){const c=cc();F.a=String(Math.max(0,+(S.bal[c]-C[c].fee).toFixed(6)));R()}
function rev(){const c=cc(),a=+F.a,t=(F.to||'').trim();
 if(!V[c](t))return toast('That is not a valid '+C[c].net+' address');
 if(!(a>0))return toast('Enter an amount');
 if(a+C[c].fee>S.bal[c]+1e-12)return toast('Not enough balance for amount plus fee');
 F.s=1;F.c=c;R()}
function cs(){if(F.pin!==S.pin)return toast('Wrong PIN');
 const c=F.c,a=+F.a,h='0x'+rs(HEX,64);S.bal[c]-=a+C[c].fee;
 add({to:F.to.trim(),h,fee:C[c].fee+' '+c,ti:'Sent '+c,sub:'To '+sh(F.to.trim()),d:'-'+amt(a,c)+' '+c,up:0,st:'Completed'});F.s=2;F.h=h;save();R()}
function doSwap(){const f=F.f||'ETH',t=F.t||'USDT',a=+F.a;
 if(f===t)return toast('Pick two different assets');
 if(!(a>0)||a>S.bal[f])return toast('Check the amount');
 const o=a*P[f]/P[t]*.995;S.bal[f]-=a;S.bal[t]+=o;
 add({ti:'Swapped '+f+' to '+t,sub:'In-app swap',d:'+'+amt(o,t)+' '+t,up:1,st:'Completed'});save();toast('Swapped');go('home')}
function doWd(){const c=cc('USDT'),a=+F.a,m=F.m||'Bank transfer',ac=(F.ac||'').trim();
 if(!(a>0)||a>S.bal[c])return toast('Check the amount');
 if(a*P[c]<10)return toast('Minimum withdrawal is $10');
 if(ac.length<5)return toast('Enter your account or phone number');
 if(F.pin!==S.pin)return toast('Wrong PIN');
 S.bal[c]-=a;const o=add({ti:'Withdrawal',sub:m,d:'-'+amt(a,c)+' '+c,up:0,st:'Processing'});save();
 setTimeout(()=>{o.st='Completed';save();if(v==='act')R()},6000);toast('Withdrawal submitted');go('act')}
function faucet(){const g={BTC:.05,ETH:1,SOL:10,BNB:2,USDT:500};Object.keys(g).forEach(k=>{S.bal[k]+=g[k];add({ti:'Demo funds',sub:'Test faucet',d:'+'+g[k]+' '+k,up:1,st:'Completed'})});save();R();toast('Demo funds added')}
function addB(){const n=$('bn').value.trim(),a=$('ba').value.trim();
 if(!n)return toast('Enter a name');if(!(V.BTC(a)||V.ETH(a)||V.SOL(a)))return toast('Enter a valid wallet address');
 S.book.push({name:n,addr:a});save();toast('Contact saved');F.rv=F.rv;R()}
function delB(i){S.book.splice(i,1);save();R()}
function rv(el){if(F.rp===S.pin){F.rv=1;R()}else{toast('Wrong PIN');el.value=''}}
function lock(){go('lock')}
function unlock(el){if(F.l===S.pin)go('home');else{toast('Wrong PIN');el.value=''}}
function reset(){if(!F.rs){F.rs=1;R();return}try{localStorage.removeItem(K)}catch(e){}mem=null;S=null;go('onb0')}
function imp(){const w=(F.ph||'').trim().toLowerCase().split(/\s+/);if(w.length!==12)return toast('A recovery phrase has 12 words');tmp={ph:w,imp:1};go('onb1')}
function pin1(){if(!/^\d{4}$/.test(F.p1||''))return toast('The PIN must be 4 digits');if(F.p1!==F.p2)return toast('The PINs do not match');
 tmp.pin=F.p1;if(tmp.imp)return fin();tmp.ph=Array.from({length:12},()=>WORDS[crypto.getRandomValues(new Uint8Array(1))[0]%WORDS.length]);go('onb2')}
function fin(){S={pin:tmp.pin,phrase:tmp.ph,bal:{BTC:0,ETH:0,SOL:0,BNB:0,USDT:0},addr:mk(),tx:[],book:[{name:'Sample friend',addr:'0x'+rs(HEX,40)}]};save();go('home')}
const X={ADA:['Cardano',.45],XRP:['XRP',.62],DOGE:['Dogecoin',.16],AVAX:['Avalanche',36],LINK:['Chainlink',15],TON:['Toncoin',6.2],SHIB:['Shiba Inu',.000022],PEPE:['Pepe',.0000095],BONK:['Bonk',.000021],WIF:['dogwifhat',2.1],FLOKI:['Floki',.00014]};
Object.keys(X).forEach(k=>P[k]=X[k][1]);

 if(F.cm==='l')s+=`<polyline fill='none' stroke='${cl}' stroke-width='2' stroke-linejoin='round' points='${cs.map((q,i)=>x(i)+','+y(q.c)).join(' ')}'/>`;else cs.forEach((q,i)=>{const c=q.c>=q.o?'var(--ok)':'var(--bad)',t=y(Math.max(q.o,q.c)),b=y(Math.min(q.o,q.c));s+=`<line x1='${x(i)}' x2='${x(i)}' y1='${y(q.h)}' y2='${y(q.l)}' stroke='${c}'/><rect x='${(x(i)-bw*.32).toFixed(1)}' y='${t}' width='${(bw*.64).toFixed(1)}' height='${Math.max(1.5,b-t).toFixed(1)}' fill='${c}' rx='1'/>`});
 const cy=+y(P[k]);return s+`<line x1='0' x2='${W-pd}' y1='${cy}' y2='${cy}' stroke='var(--mu)' stroke-dasharray='4 4'/><rect x='${W-pd+2}' y='${cy-9}' width='${pd-2}' height='18' rx='9' fill='var(--card)'/><text x='${W-pd/2+1}' y='${cy+3.5}' font-size='9' text-anchor='middle' fill='var(--tx)'>${fp(P[k]).replace('$','')}</text></svg>`}
function buy(k){if(!C[k])return toast('This asset cannot be held in the wallet yet');const f=S.bal.USDT>0&&k!=='USDT'?'USDT':Object.keys(C).find(x=>x!==k&&S.bal[x]>0);if(!f)return toast('Add test funds first, then you can buy');go('swap',{f,t:k})}

let strm=null,sdet=null,stm=0;
async function startScan(){const vd=$('sv');if(!vd)return;try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;if(!('BarcodeDetector' in window))throw 1;sdet=sdet||new BarcodeDetector({formats:['qr_code']});strm=strm||await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});vd.srcObject=strm;await vd.play();const loop=async()=>{if(v!=='scan'||!$('sv')){stopScan();return}try{const b=await sdet.detect(vd);if(b.length){stopScan();gotAddr(b[0].rawValue);return}}catch(e){}stm=setTimeout(loop,300)};loop()}catch(e){const m=$('sm');if(m)m.textContent=e===1?'This browser cannot read QR codes. Paste the address below instead.':'The camera is not available here. It works on the app\u2019s own web address. Paste the address below instead.'}}
function stopScan(){clearTimeout(stm);if(strm){strm.getTracks().forEach(t=>t.stop());strm=null}}
function gotAddr(t){const a=(t||'').trim().replace(/^[a-z]+:(\/\/)?/i,'').split(/[?&]/)[0],c=V.ETH(a)?'ETH':V.BTC(a)?'BTC':V.SOL(a)?'SOL':null;if(!c)return toast('That is not a wallet address I recognize');go('send',{c,to:a});toast('Address scanned')}
const phd=()=>`<div class=ph>${orb(40)}<div class=g style="cursor:pointer;min-width:0" onclick="go('acc')"><div class=mu style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(hdl())}</div><b style="font-size:20px">${esc(S.accts[S.cur].n)} ▾</b></div><button class=bk style="background:none" aria-label="Scan QR code" onclick="stopScan();go('scan')">${ico('scan')}</button></div>`;
const kpd=()=>`<div class=kp>${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(c=>`<button onclick="kk('${c}')">${c}</button>`).join('')}</div>`;
Object.assign(VW,{
home:()=>{if(!(tot()>0))return `<div class=aur>${phd()}</div><div class="card ctr" style="margin-top:8px;padding:22px">${orb(96)}<h2 style="font-size:28px;margin:16px 0 4px">Welcome to Lumen</h2><p class=mu style="font-size:16px">Fund your account to start trading.</p><button class=btn onclick="go('dep')">Deposit</button></div>`+explore();const t=chg();return `<div class=aur>${phd()}<h1 id=bal class=big>${usd(t.v)}</h1><div class=cr><b id=chg class="${t.c<0?'dn':'up'}">${sg(t.c)}</b><span id=pct class="pct ${t.c<0?'dn':'up'}">${(t.p>0?'+':'')+t.p.toFixed(2)}%</span></div></div><div class=tiles>${[['recv','Receive','recv'],['send','Send','send'],['swap','Swap','swap'],['buy','Buy','dep']].map(x=>`<button onclick="go('${x[2]}')"><b>${ico(x[0])}</b>${x[1]}</button>`).join('')}</div><div class=tabs><span>Tokens</span><span class=mu style="cursor:pointer" onclick="toast('Collectibles are coming soon')">Collectibles</span></div><div class=tkc id=tk>${tokens()}</div>`+explore()},
scan:()=>`<div class=hd><button class=bk aria-label=Close onclick="stopScan();go('home')">✕</button><h2 style="flex:1;text-align:center;font-size:18px;margin-right:36px">Scan</h2></div><div class=scw><video id=sv playsinline muted></video><div class=sfr></div></div><p class="mu ctr" id=sm>Point your camera at a wallet address QR code.</p><div class=card><label style="margin-top:0">Or paste an address</label><input id=pa autocomplete=off placeholder="Wallet address"><button class="btn s" onclick="gotAddr($('pa').value)">Use address</button></div>`,
cash:()=>{const m=F.pm||'Google Pay';return `<div class=hd><button class=bk aria-label=Close onclick="go('dep')">✕</button><b style="font-size:18px">Add Cash</b></div><div class=amtbig style="margin:44px 0 8px;color:${+F.k?'var(--tx)':'var(--mu)'}">$${esc(F.k||'0')}</div><div class="mu ctr">Card payments are coming soon</div><div class=tp style="background:none;justify-content:space-between;margin-top:26px;font:400 16px Inter,'DM Sans',sans-serif;color:var(--mu);padding:6px 0;cursor:pointer" onclick="F.sh=1;R(1)"><span>${m}</span><span>▾</span></div><div class=pcts>${[500,1000,5000].map(a=>`<button class=pill onclick="F.k='${a}';R(1)">$${a.toLocaleString('en-US')}</button>`).join('')}</div>${kpd()}<button class=btn onclick="toast('Card payments are coming soon. Use Test funds to try the app.')">Continue</button>${F.sh?`<div class=bgd onclick="F.sh=0;R(1)"></div><div class=sheet><div style="display:flex;align-items:center;margin-bottom:10px"><button class=bk aria-label=Close onclick="F.sh=0;R(1)">✕</button><b style="flex:1;text-align:center;font-size:18px;margin-right:36px">Payment Methods</b></div>${[['Google Pay','Debit card required','GPay'],['Card','Debit or credit card','▭']].map(x=>`<div class=sr style="border:0" onclick="F.pm='${x[0]}';F.sh=0;R(1)"><span class=dic style="background:var(--bg);color:var(--tx);width:46px;height:46px;font-size:12px;border-radius:12px">${x[2]}</span><div style="flex:1"><b>${x[0]}</b><div class=mu style="font-size:14px">${x[1]}</div></div>${m===x[0]?'<span style="color:var(--ac)">✓</span>':''}</div>`).join('')}</div>`:''}`},
